name: Prepare Portfolio for Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Cloudflare tools
        run: bun add --dev @cloudflare/vite-plugin wrangler

      - name: Configure Vite for Cloudflare
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("vite.config.ts")
          s = p.read_text()

          s = s.replace(
              'import { nitro } from "nitro/vite";\n',
              ''
          )

          if 'from "@cloudflare/vite-plugin"' not in s:
              s = 'import { cloudflare } from "@cloudflare/vite-plugin";\n' + s

          s = s.replace(
              '      tanstackStart({\n        server: { entry: "server" },\n      }),\n      nitro({ preset: "render-com" }),',
              '      cloudflare({ viteEnvironment: { name: "ssr" } }),\n      tanstackStart({\n        server: { entry: "server" },\n      }),'
          )

          if 'nitro({ preset: "render-com" })' in s:
              raise SystemExit("Nitro adapter still exists")

          if 'cloudflare({ viteEnvironment: { name: "ssr" } })' not in s:
              raise SystemExit("Cloudflare plugin was not added")

          p.write_text(s)
          PY

      - name: Configure Wrangler
        run: |
          cat > wrangler.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "khaled-abdalla-guide",
            "compatibility_date": "2026-11-04",
            "compatibility_flags": ["nodejs_compat"],
            "main": "@tanstack/react-start/server-entry",
            "observability": {
              "enabled": true
            },
            "vars": {
              "HF_ENV": "prod",
              "APP_SLUG": "khaled-abdalla-guide"
            }
          }
          EOF

      - name: Configure deployment scripts
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';

          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.scripts.deploy = 'bun run build && wrangler deploy';
          p.scripts['cf-typegen'] = 'wrangler types';

          fs.writeFileSync(
            'package.json',
            JSON.stringify(p, null, 2) + '\n'
          );
          JS

      - name: Restore Cloudflare bindings
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("src/lib/bindings.server.ts")
          s = p.read_text()

          s = s.replace(
              'import process from "node:process";',
              'import { env } from "cloudflare:workers";'
          )

          s = s.replace(
              'return { HF_ENV: process.env.HF_ENV, APP_SLUG: process.env.APP_SLUG } as AppEnv;',
              'return env as unknown as AppEnv;'
          )

          if 'process.env' in s:
              raise SystemExit("Node process binding remains")

          if 'cloudflare:workers' not in s:
              raise SystemExit("Cloudflare binding import missing")

          p.write_text(s)
          PY

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock vite.config.ts wrangler.jsonc src/lib/bindings.server.ts
          git diff --cached --quiet || git commit -m "Prepare portfolio for Cloudflare Workers"
          git push
