name: Prepare portfolio for Render

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Adapt project for Render
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const vitePath = 'vite.config.ts';
          let vite = fs.readFileSync(vitePath, 'utf8');

          const cloudflareImport =
            'import { tanstackStart } from "@tanstack/react-start/plugin/vite";';

          if (!vite.includes('import { nitro } from "nitro/vite";')) {
            vite = vite.replace(
              cloudflareImport,
              cloudflareImport + '\nimport { nitro } from "nitro/vite";'
            );
          }

          const start = vite.indexOf(
            '    // The server bundle runs as a Cloudflare Worker'
          );
          const end = vite.indexOf('    plugins: [', start);

          if (start >= 0 && end >= 0) {
            vite = vite.slice(0, start) + vite.slice(end);
          }

          const tanstackPlugin =
            '      tanstackStart({\n        server: { entry: "server" },\n      }),';

          if (!vite.includes('nitro({ preset: "render-com" })')) {
            if (!vite.includes(tanstackPlugin)) {
              throw new Error('TanStack plugin location not found');
            }
            vite = vite.replace(
              tanstackPlugin,
              tanstackPlugin + '\n      nitro({ preset: "render-com" }),'
            );
          }

          fs.writeFileSync(vitePath, vite);

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts.start = 'node .output/server/index.mjs';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const bindingPath = 'src/lib/bindings.server.ts';
          let binding = fs.readFileSync(bindingPath, 'utf8');
          binding = binding.replace(
            'import { env } from "cloudflare:workers";',
            'import process from "node:process";'
          );
          binding = binding.replace(
            'return env as unknown as AppEnv;',
            'return { HF_ENV: process.env.HF_ENV, APP_SLUG: process.env.APP_SLUG } as AppEnv;'
          );
          fs.writeFileSync(bindingPath, binding);
          NODE

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Commit Render adaptation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite.config.ts package.json src/lib/bindings.server.ts
          git commit -m "Adapt portfolio for Render hosting"
          git push
