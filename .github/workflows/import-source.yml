name: Import portfolio source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and extract source
        run: |
          curl -fL "https://d2ol7oe51mr4n9.cloudfront.net/user_3JdxSMywJqOgDmz8I2fI3w5YD5G/589733c7-1593-4d49-8ce2-7a17f02de0a4.zip" -o source.zip
          unzip -q source.zip
          cp -a app/. .
          rm -rf app source.zip

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import portfolio source"
          git push
